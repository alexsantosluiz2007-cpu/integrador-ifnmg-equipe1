<body class="body">
    <div class="login">
        <form id="login-form">
            <label for="username" class="usuario">Usuário:</label>

            <input type="text" id="username" name="username"  placeholder="Digite seu usuário" required required class="nome"><br><br>
            
            <div class="Senha">
            <label for="password">Senha:</label>
            <i class="bi bi-lock"></i>
            <input type="password" id="password" name="password" placeholder="Digite sua senha" required class="senha"><br><br>
            </div>
    
            <input type="button" value="Entrar" class="entrar" onclick="window.location.href='dash-int/dashboard.html'">
            <a href="esqueci-senha.html" class="alterar-senha">Alterar Senha</a>
            <a href="cadastro.html" class="cadastro">Cadastrar-se</a>

            <img src="img2/image.png" alt="Logo do site" class="logo">
        </form>
    </div>
    
</body>
