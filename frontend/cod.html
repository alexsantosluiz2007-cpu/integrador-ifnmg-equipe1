<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
     <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>codigo de acesso</title>
   <style>
        .bi {
            position: absolute;
            color: #888;
        }
        .bi-key {
            position: absolute;
            margin-top: 11.5px;
            margin-left: 10px;
        }   
   </style>
</head>
    <div class="cod">
        <form action="altsenha.html">
            <label for="cod" class="text-cod">Código de Acesso:</label>
            <i class="bi-key"></i>
            <input type="text" oninput="this.value=this.value.replace(/\D/g,'')" id="cod" name="cod" class="acesso" placeholder="Digite o código de 4 dígitos" maxlength="4" required>


            <button type="submit" class="botao-verificar">Verificar</button>
             <a href="esqueci-senha.html" class="voltar-cod">Voltar para Email</a>

             <img src="img2/image.png" alt="Logo do site" class="logo4">
        </form>
    </div>
<body>
    <script>
    document.addEventListener("keydown", function(e){
    // Ctrl + U
    if(e.ctrlKey && e.key.toLowerCase() === "u"){
        e.preventDefault();
        alert("Ver código-fonte está desabilitado!");
    }
    // F12
    if(e.key === "F12"){
        e.preventDefault();
        alert("Inspecionar está desabilitado!");
    }
});
</script>
</body>
</html>
